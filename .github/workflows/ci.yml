name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: make analyze
      - run: make test

  # Every push to main releases. The version is the pubspec one while it has no
  # release yet (so a manual 1.1.0 is honoured), then the next patch. It is
  # committed here, before the builds, so the tag, the installers and the
  # version the app reports are the same number. [skip ci] stops the loop.
  version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUB=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          V=$PUB
          if gh release view "v$PUB" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            V=$(echo "$PUB" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "releasing $V (pubspec: $PUB)"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          V=${{ steps.pick.outputs.version }}
          sed -i "s|^version: .*|version: $V+${{ github.run_number }}|" pubspec.yaml
          git diff --quiet pubspec.yaml && exit 0
          git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "Version $V [skip ci]" pubspec.yaml
          git push origin HEAD:main

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux }
          - { os: windows-latest, target: windows }
          - { os: macos-latest,   target: macos }
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      # Build this commit, but stamped with the version being released: the app
      # bundle's own version comes from pubspec, not from the dart-define.
      - run: |
          sed -i.bak "s|^version: .*|version: $VERSION+${{ github.run_number }}|" pubspec.yaml
          rm pubspec.yaml.bak
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - if: matrix.target == 'macos'
        run: brew install automake libtool  # libserialport pod builds from source
      - run: flutter build ${{ matrix.target }} --release --dart-define=APP_VERSION=$VERSION

      # Installers. Archived on the build host: upload-artifact drops symlinks and exec bits.
      - if: matrix.target == 'linux'
        run: |
          linux/package-deb.sh "$VERSION"
          tar czf Pantrace-linux-x64.tar.gz -C build/linux/x64/release bundle
      - if: matrix.target == 'windows'
        # pwsh, not bash: git-bash rewrites the leading-slash /D flag into a path.
        shell: pwsh
        run: iscc "/DAppVersion=$env:VERSION" windows/installer.iss
      - if: matrix.target == 'macos'
        run: |
          mkdir dmg && cp -R build/macos/Build/Products/Release/Pantrace.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Pantrace -srcfolder dmg -ov -format UDZO Pantrace-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Pantrace-${{ matrix.target }}
          path: Pantrace-*

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      # Tags the bumped main, so v<tag> contains the pubspec that says <tag>.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" && { echo "$TAG exists, skipping"; exit 0; }
          gh release create "$TAG" Pantrace-* -R "$GITHUB_REPOSITORY" \
            --target main --generate-notes

      # The Homebrew cask in PanterSoft/homebrew-pantersoft follows the latest
      # release on its own (hourly workflow there); nothing to do here.
